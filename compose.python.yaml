# docker-compose.yml
services:
  python-app:
    image: ${CONTAINER_REGISTRY_URL:-localhost}/fastapi:${APP_IMAGE_TAG:-latest}
    container_name: fastapi
    build:
      context: .
      target: python-dev
      dockerfile: Dockerfile
    volumes:
      - ./src:/app/src:Z
    ports:
      - 8000:8000

  cpp-app:
    image: ${CONTAINER_REGISTRY_URL:-localhost}/dice-server:${APP_IMAGE_TAG:-latest}
    container_name: dice-server
    build:
      context: .
      target: cpp-prd
      dockerfile: Dockerfile
    ports:
      - 8080:8080
