apiVersion: v2
name: pyproject-template
description: A Helm chart for FastAPI Python application with OpenTelemetry Collector and OpenObserve
type: application
version: 0.1.0
appVersion: "0.0.1"

dependencies:
  - name: opentelemetry-collector
    version: "0.180.0"
    repository: "https://open-telemetry.github.io/opentelemetry-helm-charts"
    condition: opentelemetry-collector.enabled
  - name: openobserve-standalone
    version: "1.1.6"
    repository: "https://charts.openobserve.ai"
    condition: openobserve-standalone.enabled
